server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/repair_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.property.repair.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-signing-repair-system}
  expiration: 86400000  # 24 hours
  refresh-expiration: 604800000  # 7 days

# Application Configuration
repair:
  # Timeout thresholds (minutes)
  timeout:
    accept-minutes: 30       # Worker must accept within 30 min
    complete-hours: 48       # Must complete within 48 hours
    escalation-delay: 15     # Escalate to supervisor after 15 min past deadline
  # Duplicate detection
  duplicate:
    window-hours: 24         # Look back 24h for duplicates
    similarity-threshold: 0.8
  # File upload
  upload:
    base-path: ${UPLOAD_PATH:./uploads}
    allowed-types: jpg,jpeg,png,gif,mp4,avi,pdf
    max-size: 10485760       # 10MB

# Logging
logging:
  level:
    com.property.repair: DEBUG
    com.property.repair.mapper: DEBUG
